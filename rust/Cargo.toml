# Rust extension layer for scicore.
#
# All native Rust kernels are built into one CPython extension
# (`scicore._scicore_rs`). The source modules remain separated by domain under
# `src/`. `rust/` is the crate root and the maturin build target (see
# `[tool.maturin]` in pyproject.toml).
[package]
name = "scicore-rust"
version = "2.0.0-dev"
edition = "2021"
license = "BSD-3-Clause"
description = "Rust extension kernels for SciCore"

[lib]
name = "_scicore_rs"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
matrixmultiply = "0.3.11"
pyo3 = { version = "0.30.1", features = ["macros"] }
