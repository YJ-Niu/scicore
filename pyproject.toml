[build-system]
# The build is driven by ``maturin``: it compiles the pyo3 crate
# (``rust/scicore_rs``) into the ``scicore._scicore_rs`` extension and packages
# the ``python/`` tree into a wheel. The only external tool required is
# ``cargo``; maturin itself is provided by the build frontend.
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
# pyo3 bindings; the Python package lives under `python/` and the pyo3 crate is
# the `scicore_rs` workspace member. The extension is placed at
# `scicore._scicore_rs` (i.e. `python/scicore/_scicore_rs`).
bindings = "pyo3"
python-source = "python"
manifest-dir = "rust"
module-name = "scicore._scicore_rs"

[project]
# The distribution is `scirs`; the *import* package stays `scicore` so this
# remains a drop-in replacement -- `pip install scirs`, then `import scicore`.
name = "scirs"
version = "0.1.5"
license = { file = "LICENSE.txt" }
# PEP 639: without an explicit list maturin auto-detects every LICENSE* file
# in the project root and advertises it as License-File metadata. That pulls
# in LICENSES_bundled.txt (SciPy's bundled-third-party-libs list), which is
# not copied into the sdist, and PyPI rejects the sdist with a 400
# ("License-File ... does not exist"). Pin the list to the real license.
license-files = ["LICENSE.txt"]
description = "Fundamental algorithms for scientific computing in Python, built on rsnumpy"
authors = [
    { name = "YJ-Niu" },
]
maintainers = [
    { name = "SciCore Developers" },
]
keywords = [
    "scientific",
    "computing",
    "linear-algebra",
    "rsnumpy",
    "rust",
]
requires-python = ">=3.12"
dependencies = [
    "rsnumpy>=1.2.8",
]
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
homepage = "https://github.com/YJ-Niu/scicore"
documentation = "https://github.com/YJ-Niu/scicore#readme"
source = "https://github.com/YJ-Niu/scicore"
download = "https://pypi.org/project/scirs/"
tracker = "https://github.com/YJ-Niu/scicore/issues"

# NOTE: when updating this table, also update `dependency-groups.optional-runtime-deps`
[project.optional-dependencies]
all = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "rsplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

[dependency-groups]
optional-runtime-deps = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "rsplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

test-core = [
    "pytest>=9.1.1",
    "hypothesis>=6.30",
    "pooch",
    "pytest-xdist",  # not required, but used widely, belongs in -core
    "pytest-timeout",  # not required, but used widely, belongs in -core
]
test-mp = [
    "mpmath",
    # for PyPI: 'gmpy2; sys_platform != "win32" or platform_machine != "ARM64"'
    "gmpy2",
]
test-parallel = [
    { include-group = "test-core" },
    "pytest-run-parallel",
]
test-docs = [
    { include-group = "test-core" },
    "scipy-doctest>=2.0.0",
    "rsplotlib",
]
test-array-types = [
    { include-group = "test-core" },
    "array-api-strict>=2.3.1",
    "marray",
    # for PyPI: 'sparse; sys_platform != "win32" or platform_machine != "ARM64"'
    "sparse",
]
test = [
    { include-group = "optional-runtime-deps" },
    { include-group = "test-core" },
    { include-group = "test-mp" },
    { include-group = "test-parallel" },
    { include-group = "test-docs" },
    { include-group = "test-array-types" },
    # useful but doesn't have its own group (rarely used, and has compiled wheels so can be hard to install)
    "psutil",
]
test-fail-slow = [
    { include-group = "test-core" },
    "pytest-fail-slow",  # only one CI job; isolated so it doesn't cause failures for contributors randomly
]
coverage = [
    { include-group = "test" },  # includes all optional test and runtime deps for maximum coverage
    "pytest-cov",
]
dev = [
    { include-group = "test" },
    "scipy-stubs",
]
