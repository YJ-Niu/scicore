name: CI

on:
  push:
    branches: [main, master, dev, main-dev]
  pull_request:
    branches: [main, master, dev, main-dev]

# A new push to the same branch/PR cancels the still-running older job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # `requires-python = ">=3.12"` in pyproject.toml is the floor here.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # No git submodules remain: the former `subprojects/` C/C++ submodules were
      # removed together with the meson build.
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust kernels
        run: cargo test --workspace
        working-directory: rust

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest maturin

      # Verify the build toolchain is fully in place before building: maturin
      # (the PEP 517 backend that build_wheel.sh invokes) must be importable and
      # cargo must be on PATH. Fails fast with a clear error if a build dep is
      # missing, instead of deep inside the maturin build step.
      - name: Verify build dependencies
        run: |
          python -m maturin --version
          cargo --version

      # scicore's only runtime dependency.  The wheel is installed with
      # --no-deps below, so the smoke test needs rsnumpy from PyPI (its
      # universal2 macOS wheels cover Intel + Apple Silicon).  Pinned to the
      # version whose fixes the test suite relies on (complex convolve/prod,
      # frombuffer decoding, fromfile) — see pyproject.toml.
      - name: Install rsnumpy
        run: python -m pip install "rsnumpy>=1.2.6"

      # --skip-lint: the dedicated `lint` job already runs rustfmt + clippy, so
      # the per-cell build skips the (cached) gates to stay fast.
      - name: Build the wheel
        shell: bash
        run: ./build_wheel.sh --out-dir dist --skip-lint

      - name: Install built wheel
        shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Smoke test
        shell: bash
        run: |
          python -c "import scicore; print('scicore', scicore.__version__)"
          python -c "import scicore.linalg, scicore.io, scicore.signal, scicore.stats, scicore.spatial, scicore.interpolate, scicore.optimize, scicore.special, scicore.integrate, scicore.sparse, scicore.cluster, scicore.fft, scicore.ndimage, scicore.constants; print('all 14 submodules import OK')"
          python -m pytest -q test/test_rust_migrations.py test/test_scirs

  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
