name: Build and Publish Wheels

# 触发方式：推送 v* 标签（如 v0.1.2）或在 GitHub 上 Publish 一个 Release。
# 也可在 Actions 页手动触发（workflow_dispatch）——手动触发只构建、不发布，
# 适合先验证 wheel 能否在各平台构建。
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------- Linux: x86_64 + aarch64 ----------------
  # manylinux 容器内含全部 CPython，--find-interpreter 自动为每个版本各产出一个
  # wheel，auditwheel 重标记为 manylinux（PyPI 拒收普通 linux_* 平台标签）。
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Sync version.py with pyproject.toml
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ -f python/scicore/version.py ]]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" python/scicore/version.py
            rm -f python/scicore/version.py.bak
            echo "  -> python/scicore/version.py updated to $VERSION"
          fi

      - name: Build wheels (${{ matrix.target }})
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # ---------------- Windows: x64，按 Python 版本矩阵 ----------------
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 rsnumpy 对齐：覆盖 3.9-3.15，每个 CPython 版本一个 wheel
        # （pyo3 扩展 ABI 绑定解释器版本，逐版本构建）。
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Sync version.py with pyproject.toml
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ -f python/scicore/version.py ]]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" python/scicore/version.py
            rm -f python/scicore/version.py.bak
            echo "  -> python/scicore/version.py updated to $VERSION"
          fi

      - name: Build wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  # ---------------- macOS: universal2（Intel + Apple Silicon），按版本矩阵 ----------------
  # macos-latest 是 arm64：x86_64 切片交叉编译（pyo3 支持），两个切片用
  # lipo 合并进一个 universal2 wheel，无需 Intel 机器。
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 rsnumpy 对齐：覆盖 3.9-3.15，每个 CPython 版本一个 universal2 wheel。
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync version.py with pyproject.toml
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ -f python/scicore/version.py ]]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" python/scicore/version.py
            rm -f python/scicore/version.py.bak
            echo "  -> python/scicore/version.py updated to $VERSION"
          fi

      - name: Build universal2 wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist

  # ---------------- 源码分发（sdist）----------------
  # 当某平台/版本无预编译 wheel 时，pip 可用 sdist 从源码构建（需目标机器有 Rust）。
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync version.py with pyproject.toml
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ -f python/scicore/version.py ]]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" python/scicore/version.py
            rm -f python/scicore/version.py.bak
            echo "  -> python/scicore/version.py updated to $VERSION"
          fi

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # ---------------- 发布前验证（PyPI gate）----------------
  # 用刚构建出的 linux x86_64 wheel（cp312）跑一遍验证套件，确保要发到
  # PyPI 的产物本身是可用的。手动 workflow_dispatch 触发时同样会跑，
  # 正好用来先验证各平台 wheel 的构建结果。
  test:
    name: Verify release artifact
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download linux x86_64 wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist

      # scicore's only runtime dependency: the wheel below is installed with
      # --no-deps, so the verification suite needs rsnumpy from PyPI — same
      # pin as ci.yml's "Install rsnumpy" step (the suite relies on the 1.2.6
      # fixes; see pyproject.toml).
      - name: Install rsnumpy
        run: pip install "rsnumpy>=1.2.6"

      - name: Install built wheel + pytest
        run: |
          WHEEL=$(ls dist/*cp312*.whl 2>/dev/null | head -n1 || true)
          if [[ -z "$WHEEL" || ! -f "$WHEEL" ]]; then
            echo "Error: no cp312 manylinux wheel found in dist/" >&2
            ls -la dist/ >&2
            exit 1
          fi
          pip install --no-deps "$WHEEL"
          pip install pytest

      - name: Run verification suite
        run: python -m pytest -q test/test_rust_migrations.py test/test_scirs

  # ---------------- 发布到 PyPI（仅标签 / Release 触发）----------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist, test]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        # `maturin upload/publish` 命令已弃用（PyO3/maturin#2334），改用 twine。
        env:
          # 仓库 Settings → Secrets and variables → Actions 中的 secret
          # （值为 PyPI token，以 pypi- 开头）。
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.YJ_NIU }}
        run: |
          pip install twine
          twine upload --non-interactive --skip-existing dist/*
